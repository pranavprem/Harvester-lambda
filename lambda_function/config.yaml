region: us-west-1

function_name: harvester
handler: service.handler
description: Harvests any URL on the internet
runtime: python3.14
# role: lambda_basic_execution

# S3 upload requires appropriate role with s3:PutObject permission
# (ex. basic_s3_upload), a destination bucket, and the key prefix
# bucket_name: 'example-bucket'
# s3_key_prefix: 'path/to/file/'

# Leave these blank. The deploy path uses the AWS credential chain
# (environment variables, ~/.aws/credentials, or a role). Never commit keys.
aws_access_key_id:
aws_secret_access_key:

# dist_directory: dist
timeout: 35
# memory_size: 512
# concurrency: 500
#

# Experimental Environment variables
environment_variables:
    NLTK_DATA: ./nltk_data

# If `tags` is uncommented then tags will be set at creation or update
# time.  During an update all other tags will be removed except the tags
# listed here.
#tags:
#    tag_1: foo
#    tag_2: bar

# Build options. scripts/package_lambda.sh is the supported packager.
# source_directories is the list the archived python-lambda CLI would copy.
build:
  source_directories: nltk_data
